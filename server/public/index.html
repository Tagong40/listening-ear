<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Listening Ear Console</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            color-scheme: light;
            --ink: #202020;
            --muted: #69706f;
            --panel: #ffffff;
            --line: #e8e8e8;
            --accent: #16c0a4;
            --accent-soft: #e8faf6;
            --danger: #c84c4c;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #f8fbfa 0%, #eef8f5 48%, #ffffff 100%);
            color: var(--ink);
            font: 16px/1.5 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
        }

        main {
            width: min(1080px, calc(100% - 40px));
            margin: 0 auto;
            padding: 42px 0 72px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: end;
            gap: 24px;
            padding-bottom: 32px;
            border-bottom: 1px solid var(--line);
        }

        h1,
        h2,
        p {
            margin: 0;
        }

        h1 {
            font-size: clamp(42px, 6vw, 80px);
            font-weight: 800;
            line-height: 1.05;
            letter-spacing: -0.04em;
        }

        h2 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .eyebrow {
            color: #118b78;
            font: 11px/1.2 'DM Mono', monospace;
            letter-spacing: .08em;
            text-transform: uppercase;
            margin-bottom: 12px;
        }

        .muted {
            color: var(--muted);
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--line);
            padding: 24px;
            margin-top: 24px;
            border-radius: 12px;
            box-shadow: 0 18px 40px rgba(32, 32, 32, .05);
        }

        .auth {
            max-width: 480px;
        }

        label {
            display: grid;
            gap: 7px;
            margin-top: 16px;
            color: var(--muted);
            font: 12px 'DM Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            background: #ffffff;
            color: var(--ink);
            padding: 12px;
            font: 16px 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
            border-radius: 9px;
        }

        button {
            border: 0;
            background: var(--accent);
            color: #ffffff;
            padding: 11px 16px;
            margin-top: 18px;
            cursor: pointer;
            font: 700 14px 'Plus Jakarta Sans', Inter, system-ui, sans-serif;
            border-radius: 9999px;
        }

        button.secondary {
            background: transparent;
            color: #202020;
            border: 1px solid var(--line);
        }

        button.danger {
            color: var(--danger);
        }

        .actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-top: 20px;
        }

        .app {
            border: 1px solid var(--line);
            padding: 18px;
            background: #ffffff;
            border-radius: 12px;
        }

        .app h3 {
            margin: 0 0 14px;
            font-size: 22px;
        }

        .key {
            overflow-wrap: anywhere;
            color: #118b78;
            font: 12px 'DM Mono', monospace;
            margin-top: 8px;
        }

        .usage {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            margin-top: 18px;
        }

        .usage-item {
            background: #f5fbf9;
            border: 1px solid #e2f1ee;
            border-radius: 9px;
            padding: 10px;
        }

        .usage-value {
            display: block;
            color: #118b78;
            font-size: 20px;
            font-weight: 800;
            line-height: 1.1;
        }

        .usage-label {
            display: block;
            color: var(--muted);
            font: 10px/1.2 'DM Mono', monospace;
            margin-top: 5px;
            text-transform: uppercase;
        }

        .secret {
            border-left: 3px solid var(--accent);
            background: var(--accent-soft);
            padding: 14px;
            margin-top: 16px;
            overflow-wrap: anywhere;
            font: 12px 'DM Mono', monospace;
        }

        .hidden {
            display: none;
        }

        #message {
            min-height: 24px;
            color: #118b78;
            margin-top: 18px;
        }

        @media (max-width: 620px) {
            main {
                width: min(100% - 24px, 1080px);
                padding-top: 24px;
            }

            header {
                align-items: start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>
    <main>
        <header>
            <div>
                <div class="eyebrow">Listening Ear / Control</div>
                <h1>Your realtime apps.</h1>
            </div><button id="logout" class="secondary hidden">Sign out</button>
        </header>
        <p id="message"></p>
        <section id="auth" class="panel auth">
            <h2>Sign in or create an account</h2>
            <p class="muted">Your applications and credentials belong only to you.</p>
            <form id="auth-form"><label>Email<input id="email" type="email" required
                        autocomplete="email"></label><label>Password<input id="password" type="password" minlength="10"
                        required autocomplete="current-password"></label>
                <div class="actions"><button type="submit">Sign in</button><button id="register" type="button"
                        class="secondary">Create account</button></div>
            </form>
        </section>
        <section id="console" class="hidden">
            <div class="panel">
                <h2>Create an application</h2>
                <form id="create-form"><label>Application name<input id="app-name" maxlength="80" required
                            placeholder="Acme production"></label><button type="submit">Create app</button></form>
            </div>
            <div class="panel">
                <h2>Your applications</h2>
                <div id="apps" class="grid"></div>
            </div>
        </section>
    </main>
    <script>
        const api = '/control/api';
        const state = { token: localStorage.getItem('listeningEarToken') };
        const $ = (id) => document.getElementById(id);
        function message(text, error = false) { $('message').textContent = text; $('message').style.color = error ? 'var(--danger)' : '#118b78'; }
        async function request(path, options = {}) { const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) }; if (state.token) headers.Authorization = `Bearer ${state.token}`; const response = await fetch(api + path, { ...options, headers }); const body = await response.json().catch(() => ({})); if (!response.ok) throw new Error(body.error || `Request failed (${response.status})`); return body; }
        function showConsole() { $('auth').classList.add('hidden'); $('console').classList.remove('hidden'); $('logout').classList.remove('hidden'); loadApps(); }
        async function loadApps() { const { apps } = await request('/apps'); $('apps').innerHTML = apps.length ? apps.map((app) => { const usage = app.usage || {}; return `<article class="app"><h3>${escapeHtml(app.name)}</h3><div class="muted">Application ID</div><div class="key">${app.app_id}</div><div class="muted" style="margin-top:12px">Public key</div><div class="key">${app.app_key}</div><div class="usage"><div class="usage-item"><span class="usage-value">${usage.requests || 0}</span><span class="usage-label">Requests</span></div><div class="usage-item"><span class="usage-value">${usage.events_sent || 0}</span><span class="usage-label">Events sent</span></div><div class="usage-item"><span class="usage-value">${usage.connections_total || 0}</span><span class="usage-label">Connections</span></div><div class="usage-item"><span class="usage-value">${usage.active_connections || 0}</span><span class="usage-label">Live now</span></div></div><button class="secondary rotate" data-id="${app.id}">Rotate secret</button></article>`; }).join('') : '<p class="muted">No applications yet.</p>'; document.querySelectorAll('.rotate').forEach((button) => button.onclick = () => rotate(button.dataset.id)); }
        async function rotate(id) { if (!confirm('Rotate this secret? Existing integrations will stop working.')) return; try { const { app_secret } = await request(`/apps/${id}/rotate-secret`, { method: 'POST' }); message(`New secret: ${app_secret}`); } catch (error) { message(error.message, true); } }
        function escapeHtml(value) { return value.replace(/[&<>"']/g, (character) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[character])); }
        $('auth-form').onsubmit = async (event) => { event.preventDefault(); try { const body = { email: $('email').value, password: $('password').value }; const result = await request('/auth/login', { method: 'POST', body: JSON.stringify(body) }); state.token = result.token; localStorage.setItem('listeningEarToken', state.token); showConsole(); message('Signed in.'); } catch (error) { message(error.message, true); } };
        $('register').onclick = async () => { try { const body = { email: $('email').value, password: $('password').value }; const result = await request('/auth/register', { method: 'POST', body: JSON.stringify(body) }); state.token = result.token; localStorage.setItem('listeningEarToken', state.token); showConsole(); message('Account created.'); } catch (error) { message(error.message, true); } };
        $('create-form').onsubmit = async (event) => { event.preventDefault(); try { const result = await request('/apps', { method: 'POST', body: JSON.stringify({ name: $('app-name').value }) }); message(`App created. Save this secret now: ${result.app_secret}`); $('app-name').value = ''; loadApps(); } catch (error) { message(error.message, true); } };
        $('logout').onclick = () => { state.token = null; localStorage.removeItem('listeningEarToken'); location.reload(); };
        if (state.token) showConsole();
    </script>
</body>

</html>
